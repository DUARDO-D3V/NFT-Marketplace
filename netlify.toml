[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_MOCK_API = "true"

# Fallback da SPA: acesso direto e refresh de qualquer rota do TanStack Router.
# Arquivos estáticos existentes (assets, mockServiceWorker.js) têm precedência.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/mockServiceWorker.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
